name: CI

on:
  # Every commit on every branch; its checks also show on the branch's pull request.
  push:
    branches: ['**']
  # Nightly full run on main (03:00 UTC), so the published report stays fresh without commits.
  schedule:
    - cron: '0 3 * * *'
  # Manual run from the Actions tab or `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

# main publishes the report and its history, so its runs queue; elsewhere a newer commit cancels
# the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PUBLISH: ${{ github.ref == 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check the Playwright image matches the installed version
        run: npm run check:playwright-image

  test:
    name: test (${{ matrix.project }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The official Playwright image, the same one the Dockerfile uses locally. Its tag must match
    # @playwright/test (checked in the lint job). --ipc=host: Chromium needs more shared memory.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    strategy:
      # Let both projects finish so one failing project doesn't hide the other's results.
      fail-fast: false
      matrix:
        project: [api, ui]
    steps:
      - uses: actions/checkout@v7

      # Node comes from the image, so cache npm's download folder directly.
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.project }} tests
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results (traces, videos, screenshots)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  report:
    needs: test
    # Report even when tests fail, but not when lint failed (then no tests ran).
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Merge Allure results from all projects
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      # History is kept only for main, so trends compare main runs with each other.
      - name: Restore Allure history from the published report
        if: env.PUBLISH == 'true'
        run: curl -fsSL "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/history.jsonl" -o history.jsonl || echo "No previous history, starting a new one."

      - name: Generate Allure report
        run: |
          npm run allure:generate
          if [ -f history.jsonl ]; then cp history.jsonl allure-report/; fi

      - name: Upload Allure report
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload Allure report for GitHub Pages
        if: env.PUBLISH == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report/

  publish-report:
    needs: report
    # Publish the latest main report even when tests fail, so the failure can be read online.
    if: ${{ !cancelled() && needs.report.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Link the report in the run summary
        run: echo "### [Open the Allure report](${{ steps.deploy.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
