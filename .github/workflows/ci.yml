name: CI

on:
  push:
  pull_request:
  # Nightly full regression on main (03:00 UTC): all tests, API + UI, no filter. It publishes the
  # report, so it stays fresh without commits.
  schedule:
    - cron: '0 3 * * *'
  # Manual run from the Actions tab ("Run workflow") or `gh workflow run ci.yml`, on any branch.
  workflow_dispatch:
    inputs:
      project:
        description: Which tests to run
        type: choice
        options: [all, api, ui]
        default: all
      grep:
        description: 'Optional filter by tag or title, e.g. @smoke, @negative, UI-13'
        type: string
        required: false

# - Push to main and nightly share one group, so two runs never restore and publish the Allure
#   history at the same time. A push cancels a run in progress; a nightly waits for it.
# - Other push and PR runs: a newer commit on the same branch cancels the older run.
# - Manual runs get a group per run, so they are never cancelled or queued.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) && 'publish-main' ||
      github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) ||
      format('{0}-{1}', github.event_name, github.event.pull_request.number || github.ref)
    }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REPORT_URL: https://ananobb.github.io/Ashley
  # Push to main and the nightly run publish the report and keep the Allure history.
  PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}

jobs:
  lint:
    # Every commit is already tested by the push event, so only run pull_request for PRs from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  test:
    name: test (${{ matrix.project }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Let both projects finish so one failing project doesn't hide the other's results.
      fail-fast: false
      matrix:
        # Both projects, unless a manual run picked one.
        project: ${{ fromJSON(inputs.project == 'api' && '["api"]' || inputs.project == 'ui' && '["ui"]' || '["api","ui"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: matrix.project == 'ui'
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.project }} tests
        env:
          GREP: ${{ inputs.grep }}
        # A filter may match only one project; the other then has no tests, which is fine.
        run: npx playwright test --project="${{ matrix.project }}" ${GREP:+--grep "$GREP" --pass-with-no-tests}

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results (traces, videos, screenshots)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  report:
    needs: [lint, test]
    # Report even when tests fail, but not when lint failed (then no tests ran).
    if: ${{ !cancelled() && needs.lint.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Merge Allure results from all projects
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      # History is kept only for main, so trends compare main runs with each other.
      - name: Restore Allure history from the published report
        if: env.PUBLISH == 'true'
        run: curl -fsSL "$REPORT_URL/history.jsonl" -o history.jsonl || echo "No previous history, starting a new one."

      - name: Generate Allure report
        run: npm run allure:generate

      - name: Keep the history with the report
        run: if [ -f history.jsonl ]; then cp history.jsonl allure-report/; fi

      - name: Write test summary
        env:
          TRIGGER: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          PROJECT: ${{ inputs.project || 'all' }}
          GREP: ${{ inputs.grep }}
        run: |
          echo "**Trigger:** $TRIGGER on \`$BRANCH\` · **Projects:** $PROJECT${GREP:+ · **Filter:** \`$GREP\`}" >> "$GITHUB_STEP_SUMMARY"
          node scripts/ci-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Allure report
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload Allure report for GitHub Pages
        if: env.PUBLISH == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report/

  publish-report:
    needs: report
    # Publish the latest main report even when tests fail, so the failure can be read online.
    # Push to main and the nightly run publish; filtered manual runs must not replace the full report.
    if: ${{ !cancelled() && needs.report.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Link the report in the run summary
        run: echo "### [Open the Allure report](${{ steps.deploy.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
